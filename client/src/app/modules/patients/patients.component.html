<div class="tab-content active">
  <div class="form-section" *ngIf="isAdmin && editingId">
    <h2>Actualizar paciente</h2>
    <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form">
      <div class="form-row">
        <div class="form-group">
          <label for="name">Nombre</label>
          <input type="text" id="name" formControlName="name" class="form-control" placeholder="María">
        </div>
        <div class="form-group">
          <label for="lastName">Apellido</label>
          <input type="text" id="lastName" formControlName="lastName" class="form-control" placeholder="García">
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="phone">Teléfono</label>
          <input type="tel" id="phone" formControlName="phone" class="form-control" placeholder="+593999999999">
        </div>
        <div class="form-group">
          <label for="gender">Género</label>
          <select id="gender" formControlName="gender" class="form-control">
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="illness">Enfermedad</label>
          <input type="text" id="illness" formControlName="illness" class="form-control" placeholder="Diabetes">
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Actualizar paciente</button>
        <button type="button" (click)="clearForm()" class="btn btn-secondary" *ngIf="editingId">Cancelar</button>
      </div>
    </form>
  </div>

  <div class="list-section">
    <h2>Lista de Pacientes</h2>
    <div class="loading" *ngIf="loading">Cargando...</div>
    <div class="empty-state" *ngIf="!loading && patients.length === 0">
      <p>No hay pacientes registrados</p>
    </div>
    <div class="items-grid">
      <div class="item-card" *ngFor="let patient of patients">
        <div class="item-header">
          <div class="item-title">{{ patient.name }} {{ patient.lastName }}</div>
          <div class="item-actions" *ngIf="isAdmin">
            <button class="btn-edit" (click)="editPatient(patient)">Editar</button>
            <button class="btn-delete" (click)="deletePatient(patient.id)">Eliminar</button>
          </div>
        </div>
        <div class="item-details">
          <div class="item-detail"><strong>Email:</strong> {{ patient.email }}</div>
          <div class="item-detail"><strong>Género:</strong> {{ patient.gender }}</div>
          <div class="item-detail"><strong>Enfermedad:</strong> {{ patient.illness }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
