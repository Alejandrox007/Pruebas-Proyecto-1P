<main class="auth-page">
  <section class="auth-panel">
    <div class="auth-brand">
      <div class="brand-mark">H</div>
      <div>
        <p class="eyebrow">Hospital Ops</p>
        <h1>Atención médica, organizada.</h1>
        <p>Accede de forma segura para gestionar tus citas y tratamientos.</p>
      </div>
    </div>

    <div class="auth-card">
      <div class="auth-tabs">
        <button type="button" [class.active]="mode === 'login'" (click)="switchMode('login')">Ingresar</button>
        <button type="button" [class.active]="mode === 'register'" (click)="switchMode('register')">Crear cuenta</button>
      </div>

      <p class="alert-error" *ngIf="error">{{ error }}</p>

      <form *ngIf="mode === 'login'" [formGroup]="loginForm" (ngSubmit)="submitLogin()" class="form">
        <div class="form-group">
          <label for="login-email">Correo electrónico</label>
          <input id="login-email" type="email" formControlName="email" autocomplete="email">
        </div>
        <div class="form-group">
          <label for="login-password">Contraseña</label>
          <input id="login-password" type="password" formControlName="password" autocomplete="current-password">
        </div>
        <button class="btn btn-primary" type="submit" [disabled]="loading">
          {{ loading ? 'Ingresando…' : 'Ingresar' }}
        </button>
      </form>

      <form *ngIf="mode === 'register'" [formGroup]="registerForm" (ngSubmit)="submitRegister()" class="form">
        <div class="form-row">
          <div class="form-group">
            <label for="name">Nombre</label>
            <input id="name" formControlName="name" autocomplete="given-name">
          </div>
          <div class="form-group">
            <label for="last-name">Apellido</label>
            <input id="last-name" formControlName="lastName" autocomplete="family-name">
          </div>
        </div>
        <div class="form-group">
          <label for="register-email">Correo electrónico</label>
          <input id="register-email" type="email" formControlName="email" autocomplete="email">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="phone">Teléfono</label>
            <input id="phone" formControlName="phone" placeholder="+593999999999" autocomplete="tel">
          </div>
          <div class="form-group">
            <label for="gender">Género</label>
            <select id="gender" formControlName="gender">
              <option>Masculino</option><option>Femenino</option><option>Otro</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="birth-date">Fecha de nacimiento (opcional)</label>
          <input id="birth-date" type="date" formControlName="birthDate">
        </div>
        <div class="form-group">
          <label for="register-password">Contraseña</label>
          <input id="register-password" type="password" formControlName="password" autocomplete="new-password">
          <small>10 caracteres, mayúscula, minúscula, número y símbolo.</small>
        </div>
        <button class="btn btn-primary" type="submit" [disabled]="loading">
          {{ loading ? 'Creando…' : 'Crear cuenta de paciente' }}
        </button>
      </form>
    </div>
  </section>
</main>
